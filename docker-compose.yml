services:
    db:                                   # our Postgres service
        image: pgvector/pgvector:pg16     # Postgres 16 with pgvector already included
        container_name: docutrace-db      # fixed name for the running container
        environment:                      # read only on first start, to create the user and database
            POSTGRES_USER: docutrace
            POSTGRES_PASSWORD: docutrace123   # local dev only, never use a real password here
            POSTGRES_DB: docutrace_db
        ports:
            - "5433:5432"                 # Windows port 5433 -> Postgres port 5432 inside the container
        volumes:
            - pgdata:/var/lib/postgresql/data                        # named volume: where the database lives
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql    # bind mount: our setup script, runs only on an empty volume

volumes:
    pgdata:                               # declares the named volume used above